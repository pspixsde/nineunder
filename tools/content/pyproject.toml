[project]
name = "nu-content"
version = "0.1.0"
description = "Nine Under content pipeline CLI (manifest, ComfyUI, Blender, validate)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.scripts]
nu-content = "nu_content.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nu_content"]

[tool.uv]
package = true
